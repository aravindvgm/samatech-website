<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sama Technologies | Architecting Next-Gen SaaS & AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: #080b11; color: #ffffff; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative; }
        .bg-glow-1 { position: absolute; width: 500px; height: 500px; background: radial-gradient(circle, rgba(99, 102, 241, 0.18) 0%, rgba(0, 0, 0, 0) 70%); top: -100px; left: -100px; border-radius: 50%; z-index: 1; }
        .bg-glow-2 { position: absolute; width: 600px; height: 600px; background: radial-gradient(circle, rgba(168, 85, 247, 0.15) 0%, rgba(0, 0, 0, 0) 70%); bottom: -150px; right: -150px; border-radius: 50%; z-index: 1; }
        .grid-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px), linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px); background-size: 50px 50px; z-index: 2; }
        .container { position: relative; z-index: 10; max-width: 680px; width: 90%; background: rgba(18, 24, 38, 0.65); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; padding: 48px 36px; text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5); }
        .badge { display: inline-flex; align-items: center; gap: 8px; padding: 6px 16px; background: rgba(99, 102, 241, 0.12); border: 1px solid rgba(99, 102, 241, 0.3); border-radius: 100px; color: #818cf8; font-size: 13px; font-weight: 600; letter-spacing: 0.5px; margin-bottom: 24px; }
        .pulse-dot { width: 8px; height: 8px; background-color: #6366f1; border-radius: 50%; box-shadow: 0 0 10px #6366f1; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7); } 70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(99, 102, 241, 0); } 100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); } }
        h1 { font-size: 42px; font-weight: 800; line-height: 1.2; margin-bottom: 16px; background: linear-gradient(135deg, #ffffff 0%, #94a3b8 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .accent-text { background: linear-gradient(135deg, #818cf8 0%, #c084fc 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p { color: #94a3b8; font-size: 16px; line-height: 1.6; margin-bottom: 36px; }
        .contact-box { display: flex; flex-direction: column; gap: 12px; align-items: center; justify-content: center; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.05); padding: 20px; border-radius: 16px; }
        .contact-link { color: #38bdf8; text-decoration: none; font-weight: 600; font-size: 15px; }
        .location-text { color: #64748b; font-size: 13px; }
        .footer-text { margin-top: 32px; color: #475569; font-size: 12px; }
    </style>
</head>
<body>
    <div class="bg-glow-1"></div>
    <div class="bg-glow-2"></div>
    <div class="grid-overlay"></div>
    <div class="container">
        <div class="badge"><span class="pulse-dot"></span> System Infrastructure Initializing</div>
        <h1>Sama Technologies</h1>
        <p>Architecting Next-Gen Multi-Tenant SaaS, Cloud Architectures & Enterprise AI Platforms.<br><span class="accent-text">Launching Flagship Platform Soon.</span></p>
        <div class="contact-box">
            <a href="mailto:info@samatech.in" class="contact-link">📧 info@samatech.in</a>
            <span class="location-text">📍 Hyderabad, Telangana, India</span>
        </div>
        <div class="footer-text">&copy; 2026 Sama Technologies. All rights reserved. | samatech.in</div>
    </div>
</body>
</html>
